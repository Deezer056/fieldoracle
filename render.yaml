# Render blueprint. Lets the deployment be recreated from the repo rather than
# from remembered dashboard clicks.
services:
  - type: web
    name: fieldoracle
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Added in the Render dashboard, never committed:
      # OPENAI_API_KEY, PINECONE_API_KEY, PINECONE_INDEX
